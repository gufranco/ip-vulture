name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run the suite with coverage
        run: pnpm test --coverage

      - name: Upload the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Lint the workflows
        uses: raven-actions/actionlint@v2

  container:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t ip-vulture:ci .

      - name: Prove it boots read-only and answers
        run: |
          set -euo pipefail
          docker run -d --name ip-vulture-ci \
            --read-only --tmpfs /tmp \
            -e FEEDS_ENABLED=false \
            -e HEALTH_PATH=/__health \
            -p 3000:3000 ip-vulture:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/__health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/__health
          docker exec ip-vulture-ci id -u | grep -qv '^0$'
          docker exec ip-vulture-ci node --version

      - name: Prove the wire shape survives inside the image
        run: |
          set -euo pipefail
          HEAD=$(python3 - <<'PROBE'
          import socket

          sock = socket.create_connection(("127.0.0.1", 3000), timeout=5)
          sock.sendall(b"GET /missing HTTP/1.1\r\nHost: h\r\n\r\n")
          data = b""
          while b"\r\n\r\n" not in data:
              chunk = sock.recv(4096)
              if not chunk:
                  break
              data += chunk
          head = data.split(b"\r\n\r\n")[0].decode("latin1")
          print(head.replace("\r\n", "\n"))
          PROBE
          )
          printf '%s\n' "$HEAD"

          printf '%s\n' "$HEAD" | sed -n '1p' | grep -qx 'HTTP/1.1 404 Not Found'
          printf '%s\n' "$HEAD" | sed -n '2p' | grep -q '^Date: '
          printf '%s\n' "$HEAD" | sed -n '3p' | grep -q '^Server: Apache'
          printf '%s\n' "$HEAD" | sed -n '4p' | grep -q '^Content-Length: '
          printf '%s\n' "$HEAD" | sed -n '5p' \
            | grep -qx 'Content-Type: text/html; charset=iso-8859-1'

          if printf '%s\n' "$HEAD" | grep -qiE '^(connection|keep-alive|x-ratelimit)'; then
            echo "the image leaked a framework header" >&2
            exit 1
          fi

      - name: Stop the container
        if: always()
        run: docker rm --force ip-vulture-ci

  release:
    name: release
    runs-on: ubuntu-latest
    needs: [check, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
