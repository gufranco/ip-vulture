name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run the suite with coverage
        run: pnpm test --coverage

      - name: Upload the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Lint the workflows
        uses: raven-actions/actionlint@v2

  container:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t ip-vulture:ci .

      - name: Prove it boots read-only and answers
        run: |
          set -euo pipefail
          docker run -d --name ip-vulture-ci \
            --read-only --tmpfs /tmp \
            -e FEEDS_ENABLED=false \
            -e HEALTH_PATH=/__health \
            -p 3000:3000 ip-vulture:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/__health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/__health
          docker exec ip-vulture-ci id -u | grep -qv '^0$'
          docker rm -f ip-vulture-ci

  release:
    name: release
    runs-on: ubuntu-latest
    needs: [check, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
