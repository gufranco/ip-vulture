version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      biome:
        patterns:
          - "@biomejs/*"
      commitlint:
        patterns:
          - "@commitlint/*"
      semantic-release:
        patterns:
          - semantic-release
          - "@semantic-release/*"
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      fastify:
        patterns:
          - fastify
          - "@fastify/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
